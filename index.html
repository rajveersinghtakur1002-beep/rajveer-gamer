
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJVEER ANIME WATCH</title>
<style>
* { box-sizing: border-box; }
body {
 margin: 0;
 background: #090914;
 color: white;
 font-family: Arial;
}
header {
 background: #171329;
 padding: 20px;
 text-align: center;
}
h1 { color: #a879ff; }
nav {
 background: #211a35;
 padding: 15px;
 text-align: center;
}
nav a {
 color: white;
 margin: 8px;
 text-decoration: none;
}
main { padding: 18px; }
input {
 width: 100%;
 padding: 14px;
 border: none;
 border-radius: 10px;
}
h2 { color: #bd9aff; }
.animes {
 display: grid;
 grid-template-columns: repeat(2,1fr);
 gap: 12px;
}
.card {
 background: #1b1930;
 padding: 18px 8px;
 border-radius: 12px;
 text-align: center;
}
.card a {
 display: inline-block;
 background: #7845d9;
 color: white;
 padding: 10px;
 border-radius: 8px;
 text-decoration: none;
}
footer {
 text-align: center;
 padding: 25px;
 color: #aaa;
}
</style>
</head>
<body>

<header>
<h1>RAJVEER ANIME WATCH</h1>
<p>WELCOME TO ANIME WORLD 🌙</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#trending">Trending</a>
<a href="#about">About</a>
</nav>

<main>
<input id="search" placeholder="Search your anime...">

<h2 id="trending">🔥 TRENDING ANIME</h2>

<div class="animes">

<div class="card">
<h3>Naruto</h3>
<a href="https://www.youtube.com/results?search_query=Naruto+official+trailer">Watch Trailer</a>
</div>

<div class="card">
<h3>Demon Slayer</h3>
<a href="https://www.youtube.com/results?search_query=Demon+Slayer+official+trailer">Watch Trailer</a>
</div>

<div class="card">
<h3>One Piece</h3>
<a href="https://www.youtube.com/results?search_query=One+Piece+official+trailer">Watch Trailer</a>
</div>

<div class="card">
<h3>Jujutsu Kaisen</h3>
<a href="https://www.youtube.com/results?search_query=Jujutsu+Kaisen+official+trailer">Watch Trailer</a>
</div>

</div>

<section id="about">
<h2>ABOUT US</h2>
<p>Welcome to Rajveer Anime Watch!</p>
<p>Your Anime World ❤️</p>
</section>
</main>

<footer>
© 2026 RAJVEER ANIME WATCH
</footer>

<script>
document.getElementById("search").addEventListener("input", function() {
 document.querySelectorAll(".card").forEach(card => {
  card.style.display = card.innerText.toLowerCase()
  .includes(this.value.toLowerCase()) ? "" : "none";
 });
});
</script>

</body>
</html>
